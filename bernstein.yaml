# Bernstein orchestration config
cli: pi
model: 9router/coding-manual
team: auto
budget: "$10"

# Repo-persistent env passthrough: BERNSTEIN_ALLOWED_API_KEY_ENVS is
# propagated through build_filtered_env and survives `uv tool update`.
# Export in the shell that runs `bernstein serve`:
#   export BERNSTEIN_ALLOWED_API_KEY_ENVS=NINEROUTER_KEY,PI_PROVIDER
# Ephemeral site-packages patch (pi/opencode allowlists) re-applied via
# scripts/patch-bernstein-env.sh after upgrades.

constraints:
  - "Node.js"
  - "TypeScript preferred"
  - "vitest or jest for tests"

# Fallback ladder: if pi/9router fails, re-run with
#   bernstein --cli opencode --model 9router/coding-manual
