name: bernstein-hot-fix
on:
  issues:
    types: [labeled]

jobs:
  dispatch:
    if: >-
      github.event.label.name == 'hot-fix' ||
      github.event.label.name == 'bernstein' ||
      github.event.label.name == 'agent-fix' ||
      github.event.label.name == 'agent-task'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Forward to Bernstein
        env:
          BERNSTEIN_URL: ${{ secrets.BERNSTEIN_URL }}
          BERNSTEIN_WEBHOOK_SECRET: ${{ secrets.BERNSTEIN_WEBHOOK_SECRET }}
        run: |
          if [ -z "$BERNSTEIN_URL" ]; then echo "BERNSTEIN_URL not set — skipping dispatch"; exit 0; fi
          ts="$(date +%s)"
          body="$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg event "$GITHUB_EVENT_NAME" --arg label "${{ github.event.label.name }}" --arg issue "${{ github.event.issue.number }}" --arg title "${{ github.event.issue.title }}" --arg url "${{ github.event.issue.html_url }}" --argjson ts "$ts" '{repo:$repo, event:$event, label:$label, issue:($issue|tonumber), title:$title, url:$url, ts:$ts}')"
          sig="$(printf "%s.%s" "$ts" "$body" | openssl dgst -sha256 -hmac "$BERNSTEIN_WEBHOOK_SECRET" | awk '{print $2}')"
          curl -sS -X POST "$BERNSTEIN_URL/webhook" \
            -H "Content-Type: application/json" \
            -H "X-Bernstein-Timestamp: $ts" \
            -H "X-Bernstein-Webhook-Signature-256: sha256=$sig" \
            -d "$body" | head -c 500; echo
